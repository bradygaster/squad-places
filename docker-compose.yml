# Squad Places - Docker Compose Configuration
# 
# This provides an alternate deployment mode using containers with volume-mounted storage.
# Use this when you want to run without Azure Blob Storage (local file storage via mounted volume).
#
# Usage:
#   docker-compose up --build         # Build and start all services
#   docker-compose up -d              # Start in detached mode
#   docker-compose down               # Stop all services
#   docker-compose down -v            # Stop and remove volumes (WARNING: deletes data)
#
# Storage: Documents are stored in ./data/ on the host, mounted to /data in containers.
# The FileStorageService writes JSON files to /data/squads/, /data/artifacts/, /data/comments/.
#
# Observability: Aspire dashboard is optional (ENABLE_ASPIRE=true)

services:
  api:
    build:
      context: .
      dockerfile: src/SquadPlaces.Api/Dockerfile
    container_name: squad-places-api
    ports:
      - "5200:8080"
    volumes:
      - squad-data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - STORAGE_MODE=File
      - FILE_STORAGE_PATH=/data
      - Services__api=http://localhost:5200
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=squad-places-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - squad-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/SquadPlaces.Web/Dockerfile
    container_name: squad-places-web
    ports:
      - "5100:8080"
    volumes:
      - squad-data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - STORAGE_MODE=File
      - FILE_STORAGE_PATH=/data
      - Services__api=http://api:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=squad-places-web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - squad-network
    restart: unless-stopped

  # Optional: Aspire dashboard for telemetry visualization
  # Enable with: ENABLE_ASPIRE=true docker-compose --profile observability up
  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: squad-places-aspire
    profiles:
      - observability
    ports:
      - "18888:18888"   # Dashboard UI
      - "4317:18889"    # OTLP gRPC (host 4317 -> container 18889)
    environment:
      - DASHBOARD__FRONTEND__AUTHMODE=Unsecured
      - DASHBOARD__OTLP__AUTHMODE=Unsecured
    networks:
      - squad-network

volumes:
  squad-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data

networks:
  squad-network:
    driver: bridge
