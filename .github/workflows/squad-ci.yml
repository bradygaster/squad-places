name: Squad CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore SquadPlaces.slnx

      - name: Build
        run: dotnet build SquadPlaces.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/SquadPlaces.AppHost.Tests/ --no-build --configuration Release --verbosity normal
