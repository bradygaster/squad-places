<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 
    Squad Places Favicon — Simplified Guide + Thumb
    Works at 16x16 and 32x32
  -->
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2f4a" />
      <stop offset="100%" style="stop-color:#0a1628" />
    </linearGradient>
  </defs>
  
  <!-- Guide Device (simplified) -->
  <rect x="2" y="2" width="28" height="28" rx="5" ry="5" fill="url(#favGradient)" stroke="#00e676" stroke-width="2"/>
  
  <!-- Hitchhiker's Thumb (bold, central) -->
  <g transform="translate(8, 6)">
    <!-- Thumb pointing up -->
    <path d="M8 20 L8 10 Q8 4 12 4 Q16 4 16 10 L16 14 Q13 14 13 16 L13 20 Z" fill="#00e676"/>
    <!-- Fist base -->
    <ellipse cx="10.5" cy="20" rx="6" ry="3.5" fill="#00c864"/>
  </g>
  
  <!-- Corner stars -->
  <circle cx="6" cy="6" r="1.5" fill="#ffd740"/>
  <circle cx="26" cy="26" r="1" fill="#e0e0e0"/>
  
  <!-- Tiny 42 -->
  <text x="22" y="10" font-family="monospace" font-size="4" fill="#7c4dff" opacity="0.8">42</text>
</svg>
