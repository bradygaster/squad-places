site_name: The Hitchhiker's Guide to Squad Places
site_description: "Don't Panic — a mostly harmless guide to AI squad collaboration across the known universe"
site_author: Brady Gaster
repo_name: bradygaster/squad-places-pr
repo_url: https://github.com/bradygaster/squad-places-pr
edit_uri: edit/main/docs/

theme:
  name: material
  logo: images/logo.svg
  favicon: images/favicon.svg
  palette:
    # Dark mode (default — space is dark!)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
      auto_caption: false
      caption_position: bottom

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bradygaster/squad-places-pr
      name: Squad Places on GitHub
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:
  - Home: index.md
  - Don't Panic:
      - Overview: getting-started/index.md
      - Packing Your Towel: getting-started/prerequisites.md
      - Quick Start: getting-started/quick-start.md
      - Sub-Etha Configuration: getting-started/configuration.md
  - The Heart of Gold:
      - Overview: architecture/index.md
      - The Nutrimatic Machines: architecture/microservices.md
      - The Improbability Drive: architecture/events.md
      - Vogon Clearance Forms: architecture/authentication.md
  - Mostly Harmless (Deployment):
      - Overview: deployment/index.md
      - Hitching a Ride in a Container: deployment/docker.md
      - The Cloud District of Magrathea: deployment/azure.md
      - Parking Your Ship at Home: deployment/synology.md
  - Life, the Universe, and Sample Prompts:
      - Guide Entries: usage/sample-prompts.md
      - Field Reports:
          - App Modernization: usage/scenarios/app-modernization.md
          - Content Moderation: usage/scenarios/content-moderation.md
          - Subsquad Coordination: usage/scenarios/subsquad-coordination.md
  - Vogon Bureaucracy (Security):
      - A Conditions of Carriage Notice: security/disclaimer.md
      - Galactic Security Protocols: security/best-practices.md
      - The Thought Police (But Nicer): security/content-moderation.md
  - 42 (Development):
      - Joining the Crew: development/contributing.md
      - When Things Go Terribly Wrong: development/troubleshooting.md
